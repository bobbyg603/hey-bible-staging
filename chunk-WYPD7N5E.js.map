<ion-content>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" sizeMd="6" sizeXl="3">
        <div class="ion-padding ion-justify-content-center">
          <app-logo></app-logo>
        </div>
        <ion-list inset="true">
          <div class="ion-text-center">
            <ion-button
              [routerLink]="signUp ? signUpRouterLink : loginWithEmailRouterLink"
              fill="outline"
              >
              <ion-icon slot="start" name="mail-outline"></ion-icon>
              {{ signUpOrContinue }} with Email
            </ion-button>
            @if (showSignInWithApple) {
              <ion-button
                fill="outline"
                (click)="loginWithApple()"
                >
                <ion-icon slot="start" name="logo-apple"></ion-icon>
                {{ signUpOrContinue }} with Apple
              </ion-button>
            }
            @if (showSignInWithGoogle) {
              <ion-button
                fill="outline"
                (click)="loginWithGoogle()"
                >
                <ion-icon slot="start" name="logo-google"></ion-icon>
                {{ signUpOrContinue }} with Google
              </ion-button>
            }
            <ion-button fill="outline" [routerLink]="publicRoutePath">
              <ion-icon slot="start" name="enter-outline"></ion-icon>
              Continue without Login
            </ion-button>
            <p>
              @if (!signUp) {
                Don't have an account?
                <a [routerLink]="[]" (click)="signUp = !signUp"> Sign Up </a>
              }
              @if (signUp) {
                Already have an account?
                <a [routerLink]="[]" (click)="signUp = !signUp"> Login </a>
              }
            </p>
          </div>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
