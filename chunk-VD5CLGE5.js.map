<ion-content>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" sizeMd="6" sizeXl="3">
        <div class="ion-padding ion-text-center">
          <app-logo></app-logo>
        </div>
        <ion-list inset="true" lines="none">
          <div class="ion-text-center">
            <form [formGroup]="form" (ngSubmit)="handleLogin($event)">
              <div class="ion-text-center">
                <ion-item>
                  <ion-label position="stacked">Email</ion-label>
                  <ion-input
                    formControlName="email"
                    name="email"
                    type="email"
                    aria-label="Email"
                    errorText="Email is required"
                    autocomplete
                  ></ion-input>
                </ion-item>
                <ion-item>
                  <ion-label position="stacked">Password</ion-label>
                  <ion-input
                    formControlName="password"
                    name="password"
                    type="password"
                    aria-label="password"
                    errorText="Password must be at least 8 characters"
                    autocomplete
                  ></ion-input>
                </ion-item>
                <ion-button
                  fill="outline"
                  type="submit"
                  [disabled]="form.invalid"
                >
                  Login
                  <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
                </ion-button>
                <p>
                  Want to try a different login?
                  <a [routerLink]="loginRouterLink"> Go Back </a>
                </p>
                <p>
                  <a [routerLink]="forgotPasswordRouterLink">Forgot your password?</a>
                </p>
              </div>
            </form>
          </div>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
