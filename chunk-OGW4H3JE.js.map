<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Images</ion-title>
    <ion-buttons slot="start">
      <ion-menu-toggle autoHide="true">
        <app-menu-toggle></app-menu-toggle>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="false">
  @if (images$ | async; as images) {
    @if (images.length) {
      <cdk-virtual-scroll-viewport
        [itemSize]="itemSize"
        class="virtual-scroll-viewport ion-content-scroll-host"
        minBufferPx="2400"
        maxBufferPx="4800"
        >
        <ion-grid>
          <ion-row *cdkVirtualFor="let row of imageRows(); trackBy: trackByRowIndex">
            <ion-col
              *ngFor="let image of row; trackBy: trackByImageId"
              size="12"
              size-md="4"
            >
              <app-image-attachment-card
                [attachment]="image"
                [title]="image.title"
                [routerLink]="image.routerLink"
                (remove)="removeImage(image)"
                (regenerate)="regenerateImage(image)"
              ></app-image-attachment-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </cdk-virtual-scroll-viewport>
    }
    @if (!images.length) {
      <app-home-empty
        message="No images found."
      >
        <ion-button [routerLink]="searchRouterLink">
          Search <ion-icon slot="end" name="search-outline"></ion-icon>
        </ion-button>
      </app-home-empty>
    }
  } @else {
    <app-skeleton-card></app-skeleton-card>
    <app-skeleton-card></app-skeleton-card>
    <app-skeleton-card></app-skeleton-card>
    <app-skeleton-card></app-skeleton-card>
  }
</ion-content>
