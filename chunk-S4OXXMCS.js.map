<ion-content>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" sizeMd="6" sizeXl="3">
        <div class="ion-padding ion-text-center">
          <app-logo></app-logo>
        </div>
        <ion-list inset="true" lines="none">
          <div class="ion-text-center">
            <form [formGroup]="form" (ngSubmit)="handleResetPassword($event)">
              <div class="ion-text-center">
                <h2>Reset Your Password</h2>
                <ion-item>
                  <ion-label position="stacked">New Password</ion-label>
                  <ion-input
                    formControlName="password"
                    name="password"
                    type="password"
                    aria-label="New Password"
                    errorText="Password must be at least 8 characters"
                    autocomplete="new-password"
                  ></ion-input>
                </ion-item>
                <ion-item>
                  <ion-label position="stacked">Confirm Password</ion-label>
                  <ion-input
                    formControlName="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    aria-label="Confirm Password"
                    errorText="Passwords must match"
                    autocomplete="new-password"
                  ></ion-input>
                </ion-item>
                <div *ngIf="form.hasError('passwordMismatch')" class="error-message">
                  Passwords do not match
                </div>
                <ion-button fill="outline" type="submit" [disabled]="form.invalid">
                  Update Password
                  <ion-icon slot="end" name="checkmark-outline"></ion-icon>
                </ion-button>
              </div>
            </form>
          </div>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
