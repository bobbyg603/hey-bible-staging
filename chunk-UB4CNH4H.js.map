<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="defaultHref" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Verse</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (verse$ | async; as verse) {
    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <div class="verse-card-container">
            <app-verse-card
              [id]="verse.id!"
              [bibleId]="verse.bible_id!"
              [book]="verse.book!"
              [chapter]="verse.chapter!"
              [startVerse]="verse.start_verse!"
              [endVerse]="verse.end_verse!"
              [content]="verse.content!"
              [isFavorite]="verse.is_favorite!"
              [tagCount]="verse.tags.length"
              [tags]="verse.tags"
              [showTagsAtBottom]="true"
              (click)="handleVerseClick()"
              (tagsChanged)="refresh$.next()"
              (tagClicked)="handleTagClicked($event)"
            ></app-verse-card>
          </div>
        </ion-col>
        @if (shouldShowAddImage()) {
          <ion-col size="12">
            <div class="verse-attachment-container">
              <app-add-image-card
              [verseContent]="verse.content!"
              [creditBalance]="creditBalance()"
              (addImageClosed)="shouldShowAddImage.set(false)"
              (createImage)="handleCreateImage($event)"
              ></app-add-image-card>
            </div>
            </ion-col>
        }
      </ion-row>
      <ion-row>
        @for (attachment of attachments$ | async; track attachment) {
          <ion-col size="12" sizeMd="6" sizeLg="3">
            <div class="verse-attachment-container">
            @if (attachment.type === 'Image') {
              <app-image-attachment-card
                [title]="attachment.type"
                [attachment]="attachment"
                (remove)="handleRemoveAttachment($event)"
                (regenerate)="handleRegenerateImage($event)"
              ></app-image-attachment-card>
            } @else {
              <app-note-attachment-card
                [title]="attachment.type"
                [attachment]="attachment"
                [isEditing]="attachment.id === newNoteId()"
                (remove)="handleRemoveAttachment($event)"
                (update)="handleNoteUpdate($event)"
                (isEditingChange)="handleNoteEditingChange($event, attachment.id)"
              ></app-note-attachment-card>
            } 
            </div>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  } @else {
    <app-skeleton-card></app-skeleton-card>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <img [src]="fabIcons.add" alt="Add" class="fab-icon" />
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button (click)="showAddImage()">
        <img [src]="fabIcons.image" alt="Add Image" class="fab-icon" />
      </ion-fab-button>
      <ion-fab-button (click)="addNote()">
        <img [src]="fabIcons.pencil" alt="Add Note" class="fab-icon" />
      </ion-fab-button>
      <ion-fab-button (click)="editTags()">
        <img [src]="fabIcons.tag" alt="Edit Tags" class="fab-icon" />
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>
</ion-content>
