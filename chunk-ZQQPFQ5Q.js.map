<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon name="chevron-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Image View</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="shareImage()">
        <ion-icon name="share-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="image-container">
    @if (imageUrl()) {
    <img [src]="imageUrl()" class="full-image" alt="Full size verse image" />
    }
  </div>
</ion-content>
