<ion-card
  class="ion-text-start"
  [class.cursor-pointer]="routerLink"
  [routerLink]="routerLink || []"
>
  <ion-card-header>
    <ion-card-title>{{ title }}</ion-card-title>
    <ion-card-subtitle>{{
      attachment.created_at | date : "short"
    }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <app-image-content
      [imagePath]="attachment.storage_path"
    ></app-image-content>
    <div class="ion-padding-top">
      <ion-button
        class="regenerate-button"
        color="primary"
        expand="block"
        (click)="regenerateImage($event)"
      >
        Regenerate <ion-icon slot="end" name="refresh-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-card-content>
  <img
    [src]="closeIcon"
    alt="Close"
    class="remove-icon"
    (click)="removeAttachment($event)"
  />
</ion-card>
