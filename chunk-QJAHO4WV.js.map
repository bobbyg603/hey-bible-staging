<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Notes</ion-title>
    <ion-buttons slot="start">
      <ion-menu-toggle autoHide="true">
        <app-menu-toggle></app-menu-toggle>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (notes$ | async; as notes) {
    @if (notes.length) {
        <div class="ion-padding-top">
        @for (note of notes; track note) {
          <div class="ion-padding-start ion-padding-end ion-padding-bottom">
            <app-note-attachment-card
            [attachment]="note"
            [title]="note.title"
            [routerLink]="note.routerLink"
            (remove)="removeNote($event)"
            ></app-note-attachment-card>
          </div>
        }
        </div>
      }
      @if (!notes.length) {
        <app-home-empty
          message="No notes found."
        >
          <ion-button [routerLink]="searchRouterLink">
            Search <ion-icon slot="end" name="search-outline"></ion-icon>
          </ion-button>
        </app-home-empty>
      }
    } @else {
      <app-skeleton-card></app-skeleton-card>
      <app-skeleton-card></app-skeleton-card>
      <app-skeleton-card></app-skeleton-card>
      <app-skeleton-card></app-skeleton-card>
    }
</ion-content>
