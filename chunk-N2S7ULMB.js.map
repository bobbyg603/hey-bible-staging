@let profile = profile$ | async;

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        [defaultHref]="defaultHref"
        text=""
      ></ion-back-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="avatar-container large-avatar">
    <app-avatar
      [avatarUrl]="avatar$ | async"
      (click)="handleAvatarClicked()"
    ></app-avatar>
  </div>
  <app-profile-form
    [profile]="profile"
    [email]="email$ | async"
    (formSubmitted)="onSubmit($event)"
  ></app-profile-form>
</ion-content>
