<ion-card
  class="ion-text-start"
  [class.cursor-pointer]="routerLink() && !currentIsEditing()"
  [routerLink]="!currentIsEditing() ? (routerLink() || []) : null"
  >
  <ion-card-header>
    <ion-card-title>{{ title() }}</ion-card-title>
    <ion-card-subtitle>
      {{ attachment().last_modified | date : "short" }}
    </ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    @if (!currentIsEditing()) {
      {{ attachment().content }}
    }
    @if (currentIsEditing()) {
      <ion-textarea
        [ngModel]="attachment().content"
        ngModelChangeDebounced
        [ngModelChangeDebounceTime]="1000"
        (ngModelChangeDebounced)="onContentChange($event)"
        rows="10"
        class="edit-textarea"
        autocapitalize="sentences"
      ></ion-textarea>
    }
  </ion-card-content>

  <div class="card-actions">
    @if (currentIsEditing()) {
      <div class="save-status">
        @if (isSaving()) {
          <span class="saving-text">Saving</span>
          <ion-spinner name="dots" color="primary"></ion-spinner>
        }
        @if (!isSaving() && lastSaved()) {
          <span>
            Saved {{ lastSaved() | date:'shortTime' }}
          </span>
        }
      </div>
    }
    <img
      [src]="currentIsEditing() ? editIcons.checkmark : editIcons.pencil"
      [alt]="currentIsEditing() ? 'Done' : 'Edit'"
      class="action-icon"
      (click)="toggleEdit($event)"
    />
    <img
      [src]="closeIcon"
      alt="Close"
      class="action-icon"
      (click)="removeAttachment($event)"
    />
  </div>
</ion-card>
