<ion-chip
  class="tag-chip"
  [style.--tag-color]="color()"
  (click)="onChipClick($event)"
>
  <span class="tag-icon">{{ icon() }}</span>
  <ion-label>{{ label() }}</ion-label>
  @if (showCloseButton()) {
    <ion-icon name="close-circle" (click)="onCloseClick($event)"></ion-icon>
  }
</ion-chip>
