<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Search</ion-title>
    <ion-buttons slot="start">
      <ion-back-button
        text="Login"
        [defaultHref]="loginRouterlink"
      ></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="presentAlert()">
        <img [src]="controlKnobsIcon" alt="Settings" class="settings-icon" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Wrap search bar and suggestions in a relatively positioned container -->
  <div class="search-container">
    <form [formGroup]="formGroup">
      <!-- Wrapper for searchbar and its suggestions -->
      <div class="searchbar-wrapper">
        <ion-searchbar
          #searchbar
          formControlName="query"
          placeholder="Search verses eg John 3:16..."
          autocapitalize="words"
          autocomplete="on"
          [debounce]="100"
          (ionInput)="handleInput($event)"
          (ionFocus)="showSuggestions.set(true)"
          (ionBlur)="hideSuggestionsWithDelay()"
        >
        </ion-searchbar>
        <!-- Suggestions List - Moved inside wrapper -->
        @if (((filteredBooks$ | async) ?? []).length > 0 && showSuggestions()) {
          <ion-list class="suggestions-list">
            @for (book of filteredBooks$ | async; track book) {
              <ion-item (click)="selectBook(book)" button>
                {{ book }}
              </ion-item>
            }
          </ion-list>
        }
      </div>
    </form>
  </div>

  @let results = results$ | async; 
  @if (results) {
    <app-results
      [results]="results.results"
      [error]="results.error"
      [hideFavoriteButton]="true"
    ></app-results>
  } @else {
    <app-home-empty [message]="emptyMessage"> </app-home-empty>
  }
</ion-content>

<ion-alert
  [header]="headerMessage"
  [message]="welcomeMessage"
  [buttons]="alertButtons"
  [isOpen]="isOpen"
></ion-alert>
