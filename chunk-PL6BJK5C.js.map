@for (result of results(); track result.id) {
  <app-verse-card
    [id]="result.id!"
    [bibleId]="result.bible_id!"
    [book]="result.book!"
    [chapter]="result.chapter!"
    [startVerse]="result.start_verse!"
    [endVerse]="result.end_verse!"
    [content]="result.content!"
    [routerLink]="versesRoute() ? [versesRoute(), result.id] : []"
    [isFavorite]="result.is_favorite!"
    [hideFavoriteButton]="hideFavoriteButton()"
    [hideTagButton]="hideTagButton()"
    [tagCount]="result.tags?.length || 0"
    (favoriteRemoved)="onFavoriteRemoved()"
    (tagsChanged)="onTagsChanged()"
  ></app-verse-card>
}
@if (error()) {
  <div class="ion-padding">{{ error() }}</div>
}
@if (!error() && !results().length) {
  <div class="ion-padding-start ion-padding-end ion-padding-bottom">
    No results to display. Search for a Bible verse to get started.
  </div>
}
