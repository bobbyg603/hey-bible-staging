<ion-content>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" sizeMd="6" sizeXl="3">
        <div class="ion-padding ion-justify-content-center ion-text-center">
          <app-logo></app-logo>
          <h2>Page not found</h2>
          <ion-button [routerLink]="homeRoute">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            Home
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
