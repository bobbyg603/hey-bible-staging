<ion-card>
  <ion-card-header>
    <ion-card-title>
      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col>
            <ion-skeleton-text
              [animated]="true"
              style="width: 160px"
            ></ion-skeleton-text>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-skeleton-text [animated]="true"></ion-skeleton-text>
    <ion-skeleton-text
      class="ion-margin-top"
      [animated]="true"
    ></ion-skeleton-text>
  </ion-card-content>
</ion-card>
