<ion-tabs>
  <!-- The id="footer" is necessary to anchor the toasts above the footer -->
  <ion-tab-bar id="footer" slot="bottom">
    <ion-tab-button tab="search">
      <img [src]="icons.search" alt="Search" class="tab-icon" />
      Search
    </ion-tab-button>
    <ion-tab-button tab="favorites">
      <img [src]="icons.favorites" alt="Favorites" class="tab-icon" />
      Favorites
    </ion-tab-button>
    <ion-tab-button tab="notes">
      <img [src]="icons.notes" alt="Notes" class="tab-icon" />
      Notes
    </ion-tab-button>
    <ion-tab-button tab="images">
      <img [src]="icons.images" alt="Images" class="tab-icon" />
      Images
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
