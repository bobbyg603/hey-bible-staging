<ion-menu
  side="start"
  [contentId]="'main-content'"
  [swipeGesture]="true"
  (ionWillOpen)="onIonWillOpen()"
  (ionWillClose)="onIonWillClose()"
  type="push"
>
  <ion-header>
    <ion-toolbar>
      <ion-menu-toggle autoHide="true" slot="start">
        <ion-item lines="none">
          <app-menu-toggle [hideAvatarOnClose]="false"></app-menu-toggle>
        </ion-item>
      </ion-menu-toggle>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list lines="none">
      <ion-menu-toggle autoHide="true">
        <ion-item button [routerLink]="profileRouterLink$ | async">
          <ion-label> Profile </ion-label>
        </ion-item>
      </ion-menu-toggle>
      <ion-menu-toggle autoHide="true">
        <ion-item button [routerLink]="accountRouterLink$ | async">
          <ion-label> Account </ion-label>
        </ion-item>
      </ion-menu-toggle>
      @if (isAdmin$ | async) {
      <ion-menu-toggle autoHide="true">
        <ion-item button [routerLink]="toolsRouterLink$ | async">
          <ion-label> Tools </ion-label>
        </ion-item>
      </ion-menu-toggle>
      }
      @if (isIos) {
      <ion-menu-toggle autoHide="true">
        <ion-item button [routerLink]="settingsRouterLink$ | async">
          <ion-label> Settings </ion-label>
        </ion-item>
      </ion-menu-toggle>
      }
    </ion-list>
    <ion-list lines="none" class="sign-out-item">
      <ion-item button detail="false" (click)="signOut()">
        <ion-label><ion-text color="danger"> Log out </ion-text></ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-content>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  <app-footer></app-footer>
</ion-content>
