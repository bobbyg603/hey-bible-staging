<ion-content>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" sizeMd="6" sizeXl="3">
        <div class="ion-padding ion-text-center">
          <app-logo></app-logo>
        </div>
        <ion-list inset="true" lines="none">
          <div class="ion-text-center">
            <form [formGroup]="form" (ngSubmit)="handleForgotPassword($event)">
              <div class="ion-text-center">
                <p class="ion-margin-bottom">
                  Enter your email address and we'll send you a link to reset your password.
                </p>
                <ion-item>
                  <ion-label position="stacked">Email</ion-label>
                  <ion-input
                    formControlName="email"
                    name="email"
                    type="email"
                    aria-label="Email"
                    errorText="Email is required"
                    autocomplete
                  ></ion-input>
                </ion-item>
                <ion-button fill="outline" type="submit" [disabled]="form.invalid">
                  Send Reset Link
                  <ion-icon slot="end" name="mail-outline"></ion-icon>
                </ion-button>
                <p>
                  Remember your password?
                  <a [routerLink]="loginEmailRouterLink"> Back to Login </a>
                </p>
              </div>
            </form>
          </div>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
